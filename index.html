<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ぎゅうぎゅうりんちゃん</title>
    <style>
      /*
        既定テンプレートはキャンバスを 540px x 960px で固定するので、
        iframe に埋めると入りきらずスクロールバーが出る。

        ここでは「与えられた領域の中に収まる 9:16 の箱」を作り、
        キャンバスをそこいっぱいに置く。はみ出さないので常にスクロールなし、
        比率を保つので横長の枠に入れても絵が伸びない。
      */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231F20;
        overscroll-behavior: none;   /* スマホの引っぱり更新を止める */
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 9:16 を保ったまま、幅と高さのきつい方に合わせて縮む箱 */
      #unity-stage {
        position: relative;
        aspect-ratio: 9 / 16;
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231F20;
        touch-action: none;   /* 連打がスクロール扱いになるのを防ぐ */
        outline: none;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        width: min(70%, 260px);
      }

      #unity-loading-text {
        margin-bottom: 10px;
        color: #e8e8ea;
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 5px;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #e8e8ea;
        transition: width 0.15s linear;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        display: none;
        max-width: 90%;
        color: #111;
        font: 13px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-stage">
        <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-loading-text">ぎゅうぎゅうりんちゃん</div>
          <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        </div>
        <div id="unity-warning"></div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "background: " + (type == "error" ? "#ff6b6b" : "#ffe066") + "; padding: 8px 12px; border-radius: 6px;";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            banner.removeChild(div);
            if (!banner.children.length) banner.style.display = "none";
          }, 5000);
        }
      }

      /*
        描画解像度を表示サイズに合わせる。

        Unity の自動同期(matchWebGLToCanvasSize)に任せると、この構成では
        キャンバスの既定値 300x150 のままになって絵がぼける。
        自前で合わせるので自動同期は切る。

        端末の画素密度は 2 までに抑える。このゲームは1体 7,000 三角形を
        最大数百体出すので、3倍密度で描くと描画が先に音を上げる。
      */
      function fitCanvas() {
        var rect = canvas.getBoundingClientRect();

        /*
          【0を書き込まないこと】
          読み込み直後・タブが裏・親が display:none のときは寸法が 0 で返る。
          そのまま反映すると解像度 1x1 に潰れ、次にリサイズが起きるまで
          その大きさで描き続ける（実際に本番で 1x1 になった）。
          まともな寸法が取れるまでは、属性で指定した 540x960 のままにしておく。
        */
        if (rect.width < 2 || rect.height < 2) return;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.round(rect.width * dpr);
        var h = Math.round(rect.height * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALKA",
        productName: "ぎゅうぎゅうりんちゃん",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: false,
        autoSyncPersistentDataPath: true,
      };

      fitCanvas();
      if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);
      window.addEventListener("load", fitCanvas);
      // 裏で読み込まれたときは寸法が取れない。表に出た時点でもう一度合わせる
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) fitCanvas();
      });

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          fitCanvas();
        }).catch((message) => {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
